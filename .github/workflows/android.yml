name: Android (APK + AAB)

# Compila la app Android firmada. Se dispara a mano (workflow_dispatch) o al
# empujar un tag v*. Produce el .aab (para Play Store) y el .apk (para instalar
# directo) como artefactos descargables. NO despliega nada del sitio web.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - mobile-app-overhaul
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'capacitor-shell/**'
      - '.github/workflows/android.yml'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.CAPIBARA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/capibara-release.keystore"

      - name: Build signed AAB + APK
        working-directory: android
        env:
          CAPIBARA_KEYSTORE_PATH: ${{ runner.temp }}/capibara-release.keystore
          CAPIBARA_KEYSTORE_PASSWORD: ${{ secrets.CAPIBARA_KEYSTORE_PASSWORD }}
          CAPIBARA_KEY_ALIAS: ${{ secrets.CAPIBARA_KEY_ALIAS }}
          CAPIBARA_KEY_PASSWORD: ${{ secrets.CAPIBARA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: capibaratraductor-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK (instalación directa)
        uses: actions/upload-artifact@v4
        with:
          name: capibaratraductor-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
