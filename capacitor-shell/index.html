<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CapibaraTraductor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 18px; }
      .spin { width: 26px; height: 26px; border: 3px solid #27272a; border-top-color: #06b6d4; border-radius: 50%; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      p { color: #a1a1aa; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icon.png" alt="CapibaraTraductor" />
      <div class="spin"></div>
      <p>Cargando…</p>
    </div>
    <script>
      // Con red: el WebView ya carga capibaratraductor.com vía server.url.
      // Este shell solo se ve en arranque en frío sin conexión: enviamos al
      // lector offline, que lee las descargas cifradas guardadas en el dispositivo.
      window.addEventListener('load', function () {
        if (!navigator.onLine) {
          location.replace('https://capibaratraductor.com/app/offline');
        }
      });
    </script>
  </body>
</html>
